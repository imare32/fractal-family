schema_version = "1.0.0"

id = "fractal_family"
version = "2.0.0"
name = "Fractal Family"
tagline = "Fractal curves from complex-integer genes, with a viewport HUD"
maintainer = "imare32"
type = "add-on"

website = "https://github.com/imare32/fractal-family"

tags = ["Add Curve"]

# Curve and shape key APIs used here exist in 4.2; the HUD only relies on stable
# gpu / blf entry points.
blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# No permissions are requested.
#
# Copy / Paste Gene would need ``clipboard``, and it is not part of 2.0.0: 1.1.6 asked for
# nothing, and an update that *adds* a permission changes what the listing promises, which
# is exactly the kind of change that can hold a release up.  The feature is planned for a
# follow-up version, on its own, where a review queue delay costs nobody anything.  The code
# is in the git history (see ``FRACTALFAMILY_OT_copy_gene`` in the 2.0.0 commit).
#
# No "files" permission either: the add-on performs no filesystem access at all.  The
# measured speed factor is an ordinary add-on preference, which Blender stores in its own
# preference file.  Nothing is cached to disk, so there is nothing to clean up on uninstall.

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.gitignore",
    "/.vscode/",
    "/.workbuddy/",
    "/*.zip",
]
