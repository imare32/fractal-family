schema_version = "1.0.0"

id = "fractal_family"
version = "2.0.0"
name = "Fractal Family"
tagline = "Fractal curves from complex-integer genes, with a viewport HUD"
maintainer = "imare32"
type = "add-on"

website = "https://github.com/imare32/fractal-family"

tags = ["Add Curve"]

# Curve and shape key APIs used here exist in 4.2; the HUD only relies on stable
# gpu / blf entry points.
blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# "Paste Gene" reads a gene string (e.g. "G 1 0 0 0 0 1 1 0") from the clipboard.
#
# No "files" permission, because the add-on performs no filesystem access at all: the
# measured speed factor is an ordinary add-on preference, which Blender stores in its own
# preference file.  Nothing is cached to disk, so there is nothing to clean up on uninstall
# either.
[permissions]
clipboard = "Paste gene strings copied from another file or the documentation"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.gitignore",
    "/.vscode/",
    "/.workbuddy/",
    "/*.zip",
]
